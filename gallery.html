<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Gallery - PLANA3R</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box {
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .model-container {
            flex: 1;
            min-height: 350px;
            background: #f5f5f5;
            position: relative;
            overflow: hidden;
            perspective: 1000px;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            transform: rotateX(180deg);
        }

        .item-info {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .item-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .item-path {
            font-size: 0.85em;
            color: #666;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            line-height: 1.4;
        }

        .item-buttons {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: background-color 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-download {
            background-color: #667eea;
            color: white;
        }

        .btn-download:hover {
            background-color: #5568d3;
        }

        .btn-copy {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-copy:hover {
            background-color: #e0e0e0;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px 20px;
        }

        .stats {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .model-container {
                min-height: 300px;
            }
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.1em;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        let filteredModels = [...models];

        function renderGallery(modelsToRender) {
            const gallery = document.getElementById('gallery');
            const noResults = document.getElementById('noResults');
            const modelCount = document.getElementById('modelCount');

            gallery.innerHTML = '';

            if (modelsToRender.length === 0) {
                gallery.style.display = 'none';
                noResults.style.display = 'block';
                modelCount.textContent = 'No models found';
                return;
            }

            gallery.style.display = 'grid';
            noResults.style.display = 'none';
            modelCount.textContent = `Showing ${modelsToRender.length} model${modelsToRender.length !== 1 ? 's' : ''}`;

            modelsToRender.forEach((model, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';

                const modelContainer = document.createElement('div');
                modelContainer.className = 'model-container';

                const viewer = document.createElement('model-viewer');
                viewer.setAttribute('src', model.path);
                viewer.setAttribute('alt', model.name);
                viewer.setAttribute('loading', 'lazy');
                viewer.setAttribute('camera-controls', '');
                viewer.setAttribute('touch-action', 'pan-y');
                viewer.setAttribute('environment-image', 'neutral');
                viewer.setAttribute('auto-rotate', '');
                viewer.setAttribute('shadow-intensity', '0');
                viewer.setAttribute('interaction-prompt', 'none');

                modelContainer.appendChild(viewer);

                const info = document.createElement('div');
                info.className = 'item-info';

                const title = document.createElement('div');
                title.className = 'item-title';
                title.textContent = model.name;

                const path = document.createElement('div');
                path.className = 'item-path';
                path.textContent = model.path;

                const buttons = document.createElement('div');
                buttons.className = 'item-buttons';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn btn-copy';
                copyBtn.textContent = '📋 Copy Path';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(model.path);
                    copyBtn.textContent = '✓ Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Copy Path';
                    }, 2000);
                };

                const downloadBtn = document.createElement('a');
                downloadBtn.className = 'btn btn-download';
                downloadBtn.href = model.path;
                downloadBtn.download = model.name + '.glb';
                downloadBtn.textContent = '⬇️ Download';

                buttons.appendChild(copyBtn);
                buttons.appendChild(downloadBtn);

                info.appendChild(title);
                info.appendChild(path);
                info.appendChild(buttons);

                item.appendChild(modelContainer);
                item.appendChild(info);

                gallery.appendChild(item);
            });
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filteredModels = models.filter(model => 
                model.name.toLowerCase().includes(searchTerm) ||
                model.directory.toLowerCase().includes(searchTerm) ||
                model.path.toLowerCase().includes(searchTerm)
            );
            renderGallery(filteredModels);
        });

        // Initial render
        document.addEventListener('DOMContentLoaded', () => {
            renderGallery(models);
